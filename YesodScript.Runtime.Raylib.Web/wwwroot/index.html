<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>YesodScript WebGL</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #eee;
      font-family: system-ui, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
    }

    canvas.emscripten {
      display: block;
      background: #000;
      border: none;
      outline: none;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      image-rendering: pixelated;
      touch-action: none;
      -ms-touch-action: none;
    }

    :fullscreen canvas.emscripten,
    :-webkit-full-screen canvas.emscripten {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      background: #000;
    }

    #status {
      position: fixed;
      z-index: 2;
      top: 0.5rem;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 2rem);
      padding: 0.5rem 0.75rem;
      border-radius: 0.25rem;
      background: #222;
      font-size: 0.9rem;
      pointer-events: none;
    }

    #status[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite">Loading game...</div>
  <canvas
    class="emscripten"
    id="canvas"
    oncontextmenu="event.preventDefault()"
    tabindex="-1"
  ></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
